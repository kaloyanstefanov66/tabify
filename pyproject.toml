[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabify-cli"
version = "0.1.0"
description = "Turn guitar recordings and MIDI files into playable guitar tabs, right in your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaloyan Stefanov" }]
requires-python = ">=3.10"
keywords = ["guitar", "tab", "tablature", "transcription", "music", "midi", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Everything tabify needs to transcribe a recording, including separating a full mix -
# it's a tab transcriber, so hearing a band recording is the job, not an add-on. All of it
# installs from wheels with no compiler and no native installers.
#
# Two version markers, because two upstream packages disagree about Python:
#   basic-pitch (chords)      runs on 3.11 and older
#   demucs-onnx (full mixes)  runs on 3.11 and newer
# So 3.11 is the version that gets everything, and is what pipx should be pointed at.
# Outside it tabify still installs and runs, just without whichever piece is unavailable;
# `tabify --doctor` says which, on the machine it's actually installed on.
dependencies = [
    "mido>=1.3",
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    # Runs basic-pitch's 0.2 MB ONNX model and demucs' - identical predictions to the
    # 1.2 GB TensorFlow and 550 MB PyTorch builds, and a tenth of a second to load.
    "onnxruntime>=1.17",
    "basic-pitch>=0.4; python_version < '3.12'",
    # basic-pitch's resampy dependency still imports pkg_resources, which setuptools
    # removed in 81 - without this pin, loading the model dies on a fresh install.
    "setuptools<81; python_version < '3.12'",
    "demucs-onnx>=0.3; python_version >= '3.11'",
]

[project.optional-dependencies]
# Renders --audio-out with a real guitar tone. Also needs the native FluidSynth library
# installed separately - see the "audio rendering" section of the README.
render = ["pyfluidsynth>=1.3"]
# Transcribe straight from a YouTube (or other site) link. Also needs ffmpeg on PATH.
youtube = ["yt-dlp>=2024.1"]
# The pieces that used to be opt-in and are now part of the base install. Kept so the
# install commands people already have in their notes keep working.
audio = []
ml = []
separate = []
play = []
all = ["tabify-cli[render,youtube]"]
dev = ["pytest>=8"]

[project.scripts]
tabify = "tabify.cli:main"

[project.urls]
Homepage = "https://github.com/kaloyanstefanov66/tabify"
Issues = "https://github.com/kaloyanstefanov66/tabify/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tabify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
