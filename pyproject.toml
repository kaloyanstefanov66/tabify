[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabify-cli"
version = "0.1.0"
description = "Turn guitar recordings and MIDI files into playable guitar tabs, right in your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaloyan Stefanov" }]
requires-python = ">=3.10"
keywords = ["guitar", "tab", "tablature", "transcription", "music", "midi", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = ["mido>=1.3"]

[project.optional-dependencies]
# Monophonic (single-note) transcription + beat tracking.
audio = ["librosa>=0.10"]
# Polyphonic (chords) transcription with Spotify's basic-pitch. Needs Python <= 3.11.
# setuptools<81 is pinned because basic-pitch's resampy dependency still imports pkg_resources,
# which setuptools removed entirely starting with 81 - without this pin, model loading fails
# with "ModuleNotFoundError: No module named 'pkg_resources'" on a fresh install.
ml = ["basic-pitch>=0.4", "librosa>=0.10", "setuptools<81"]
# Renders --audio-out with a real guitar tone. Also needs the native FluidSynth
# library installed separately - see the "audio rendering" section of the README.
render = ["pyfluidsynth>=1.3", "soundfile>=0.12", "numpy>=1.24"]
# Full-mix support: separates a mix into instrument stems (guitar, bass, drums, vocals, piano) before transcribing.
separate = ["demucs>=4.0"]
# Interactive play-along mode (--play): live audio output, synced scrolling/highlighted tab.
play = ["sounddevice>=0.4", "soundfile>=0.12", "numpy>=1.24"]
# Transcribe straight from a YouTube (or other site) link. Also needs ffmpeg on PATH.
youtube = ["yt-dlp>=2024.1"]
dev = ["pytest>=8"]

[project.scripts]
tabify = "tabify.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/tabify"
Issues = "https://github.com/OWNER/tabify/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tabify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
